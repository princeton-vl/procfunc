name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate history
        run: bash scripts/validate_history.sh
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  test:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - name: Run tests
        env:
          PYTEST_ADDOPTS: ${{ runner.environment != 'self-hosted' && '-m "not render"' || '' }}
        run: uv run pytest

  docs:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.11"
      - name: Build docs (warnings are errors)
        run: uv run --extra docs sphinx-build -b html -W --keep-going docs docs/_build/html
