name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:

  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'princeton-vl/procfunc'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.1"
      - run: uv build
      - run: uv publish --trusted-publishing always
